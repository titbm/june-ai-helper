<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OpenRouter API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>OpenRouter API Test</h1>
    <button onclick="testAPI()">Проверить ключ</button>
    <div id="result"></div>

    <script>
        const API_KEY = 'YOUR_API_KEY_HERE'; // Замени на свой ключ для тестирования
        
        // Топ бесплатных моделей по популярности
        const FREE_MODELS = [
            'google/gemma-3-27b-it:free',
            'google/gemini-2.0-flash-exp:free',
            'meta-llama/llama-3.3-70b-instruct:free',
            'openrouter/sherlock-think-alpha',
            'tngtech/deepseek-r1t2-chimera:free',
            'openrouter/sherlock-dash-alpha',
            'kwaipilot/kat-coder-pro:free',
            'z-ai/glm-4.5-air:free',
            'tngtech/deepseek-r1t-chimera:free',
            'deepseek/deepseek-chat-v3-0324:free',
            'deepseek/deepseek-r1-0528:free',
            'qwen/qwen3-coder:free'
        ];

        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Перебираю бесплатные модели...';
            resultDiv.className = '';

            for (let i = 0; i < FREE_MODELS.length; i++) {
                const model = FREE_MODELS[i];
                resultDiv.textContent = `Пробую модель ${i + 1}/${FREE_MODELS.length}: ${model}...`;
                
                try {
                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${API_KEY}`,
                            'Content-Type': 'application/json',
                            'HTTP-Referer': window.location.href,
                            'X-Title': 'JuneAI Helper Test'
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [
                                {
                                    role: 'user',
                                    content: 'Сгенерируй 3 интересных вопроса на тему "космос"'
                                }
                            ]
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        resultDiv.className = 'success';
                        resultDiv.textContent = `✓ Работает модель: ${model}\n\nОтвет:\n${data.choices[0].message.content}`;
                        return; // Успех - выходим
                    } else {
                        console.log(`Модель ${model} не работает:`, data);
                    }
                } catch (error) {
                    console.log(`Ошибка с моделью ${model}:`, error);
                }
            }
            
            // Если ни одна не сработала
            resultDiv.className = 'error';
            resultDiv.textContent = '✗ Ни одна бесплатная модель не работает из вашего региона.\nПопробуйте дешевую платную модель: google/gemini-flash-1.5';
        }
    </script>
</body>
</html>
