<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuneAI Helper</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <button id="lockBtn" class="lock-btn" title="Заблокировать тему">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </button>
    <div id="themeHeader" class="theme-header"></div>
    <div id="queriesList" class="queries-list"></div>

    <footer>
      <button id="generateBtn" class="btn-primary">Обновить запросы</button>
      <button id="automateBtn" class="btn-automate" disabled>Отправить все запросы</button>
      <div id="status" class="status"></div>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
